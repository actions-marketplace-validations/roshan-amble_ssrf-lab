name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      # The repository claims the guarded client stops every attack in the
      # range. This step fails the build the day that stops being true.
      - name: The guarded client must reach nothing
        run: npm run scan -- scan --client guarded --fail-on-reach
